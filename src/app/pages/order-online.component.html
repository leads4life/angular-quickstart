<app-page-hero title="Order" accent="Online" lead="Your favorites, ready when you are." image="assets/img/takeout-box.jpg">
</app-page-hero>

<section class="section cream">
  <div class="container">
    <div class="values">
      <div class="value" *ngFor="let s of steps">
        <app-icon [name]="s.icon" size="52" [stroke]="1.3"></app-icon>
        <h3>{{ s.title }}</h3>
        <p>{{ s.text }}</p>
      </div>
    </div>
    <div class="center order-cta">
      <a class="btn btn--red btn--lg" [href]="site.orderUrl">Order Now <app-icon name="arrow" size="20"></app-icon></a>
      <p class="note">Call <a [href]="site.phoneHref">{{ site.phone }}</a> to place your pickup order, or <a routerLink="/menu">browse the menu</a> first.</p>
    </div>
  </div>
</section>

<section class="banner">
  <img src="assets/img/fortune-cookie.jpg" alt="A fortune cookie with the message: Good Food Brings Good Company." loading="lazy">
</section>
