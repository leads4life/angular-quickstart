<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Golden Wok Chinese Restaurant</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Golden Wok Chinese Restaurant: authentic Chinese cuisine, takeout, catering and private events.">
  <meta name="theme-color" content="#1c110d">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Built only from facts shown on the site (placeholders until verified). -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Restaurant",
        "name": "Golden Wok Chinese Restaurant",
        "servesCuisine": "Chinese",
        "telephone": "+1-561-555-6888",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "12345 Forest Hill Blvd",
          "addressLocality": "Wellington",
          "addressRegion": "FL",
          "postalCode": "33414",
          "addressCountry": "US"
        },
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"], "opens": "11:00", "closes": "21:30" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Friday", "Saturday"], "opens": "11:00", "closes": "22:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Sunday", "opens": "12:00", "closes": "21:00" }
        ]
      },
      { "@type": "WebSite", "name": "Golden Wok Chinese Restaurant" }
    ]
  }
  </script>
</head>
<body>
  <app-root></app-root>

  <!-- Static copies of the site's forms so Netlify Forms detects them at deploy time. -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field"><input name="name"><input name="email"><input name="phone">
    <input name="inquiryType"><textarea name="message"></textarea>
  </form>
  <form name="private-events" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field"><input name="name"><input name="email"><input name="phone">
    <input name="eventDate"><input name="guests"><textarea name="message"></textarea>
  </form>
  <form name="catering" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field"><input name="name"><input name="email"><input name="phone">
    <input name="eventDate"><input name="guests"><textarea name="message"></textarea>
  </form>
</body>
</html>
